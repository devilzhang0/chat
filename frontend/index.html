<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>MyChat</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MyChat" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta id="theme-color-meta" name="theme-color" content="#F2F2F7" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="基于 Vue 3 与 WebSocket 的极简双主题实时多聊天室，支持公开/私密房间、分享链接与历史消息分页。"
    />
    <meta property="og:title" content="MyChat" />
    <meta
      property="og:description"
      content="基于 Vue 3 与 WebSocket 的极简双主题实时多聊天室，支持公开/私密房间、分享链接与历史消息分页。"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('purechat_theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved ? saved === 'dark' : prefersDark;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var themeMeta = document.getElementById('theme-color-meta');
          if (themeMeta) {
            themeMeta.setAttribute('content', isDark ? '#000000' : '#FFFFFF');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F2F2F7] text-[#1C1C1E] antialiased selection:bg-[#007AFF]/20 dark:bg-black dark:text-[#F5F5F7] dark:selection:bg-[#0A84FF]/30">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
