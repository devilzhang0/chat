<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <meta
      name="description"
      content="基于 Vue 3 与 WebSocket 的极简黑白双主题实时在线聊天室，支持历史记录与在线成员展示。"
    />
    <meta property="og:title" content="Chat" />
    <meta
      property="og:description"
      content="基于 Vue 3 与 WebSocket 的极简黑白双主题实时在线聊天室，支持历史记录与在线成员展示。"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('purechat_theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved ? saved === 'dark' : prefersDark;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F2F2F7] text-[#1C1C1E] antialiased selection:bg-[#007AFF]/20 dark:bg-black dark:text-[#F5F5F7] dark:selection:bg-[#0A84FF]/30">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
